[project]
name = "playwright-demo-async"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "allure-python-commons>=2.15.3",
    "playwright>=1.58.0",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
markers = [
    "design_remote: tests that use the remote design editor and may depend on WebGL/model initialization",
]
