      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "启动 AI 分割"
    apiName: "starAiPartition"
    description: "启动指定 taskType 的 AI 分割任务。"
    group: "AI 分割"
    source: "src/api/partition/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "17001"
        description: "网关分发指令，CommandId.StarAiPartion = 17001"
    gateway:
      enabled: true
      command: "17001"
      description: "网关分发指令，CommandId.StarAiPartion = 17001"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        surgicalDesignID: "{{designId}}"
        taskType: "dentalsegment"
        nextTaskType: "dentalarch"
      raw: "{\n  \"surgicalDesignID\": \"{{designId}}\",\n  \"taskType\": \"dentalsegment\",\n  \"nextTaskType\": \"dentalarch\"\n}"
    response:
      example:
        code: 0
        data:
          taskID: "task-id"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"taskID\": \"task-id\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "designId"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "查询 AI 分割状态"
    apiName: "getAiPartitionStatus"
    description: "查询 AI 分割任务状态和结果数据。"
    group: "AI 分割"
    source: "src/api/partition/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "17002"
        description: "网关分发指令，CommandId.QueryAiPartitionResult = 17002"
    gateway:
      enabled: true
      command: "17002"
      description: "网关分发指令，CommandId.QueryAiPartitionResult = 17002"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        taskID: "{{taskId}}"
        parameters: {}
      raw: "{\n  \"taskID\": \"{{taskId}}\",\n  \"parameters\": {}\n}"
    response:
      example:
        code: 0
        data:
          taskID: "task-id"
          status: "COMPLETED"
          data: "result-file-key"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"taskID\": \"task-id\",\n    \"status\": \"COMPLETED\",\n    \"data\": \"result-file-key\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "taskId"
    scripts:
