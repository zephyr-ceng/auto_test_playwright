apiSpecVersion: "1.0.0"
kind: "TarsModuleApiDocument"
source:
  descriptionFile: "api-docs/api-build.md"
  projectCollection: "api-docs/apifox-collection.postman.json"
  sharedEnvironment: "api-docs/apifox-shared-environment.postman_environment.json"
  generatedAt: "2026-06-24"
module:
  index: 4
  name: "手术设计"
  description: "设计列表、创建、修改、详情、开始和结束手术。"
  markdown: "md/04-surgical-design.md"
  yaml: "yaml/04-surgical-design.yaml"
environment:
  frontendBaseUrl: "http://localhost:3000"
  baseUrl: "http://localhost:3000/tars/v1"
  gatewayUrl: "http://localhost:3000/tars/v1/gateway"
  controlNodeBaseUrl: "http://192.168.0.52:38080/tars/v1"
  rosBaseUrl: "http://192.168.0.52:38081/ros_api/v1"
  chatBaseUrl: "http://192.168.2.159:9999/api/v3"
conventions:
  encoding: "UTF-8"
  defaultContentType: "application/json"
  auth: "登录成功后通过 Set-Cookie 获取 session；后续接口由 Cookie Jar 或 Apifox Cookie 管理器携带登录态。"
  gateway: "网关接口固定请求 {{gatewayUrl}}，通过小写 command 请求头区分业务指令。"
  businessStatusCodes:
    - code: 0
      name: "Success"
      description: "请求成功且业务逻辑处理正常"
    - code: 40001
      name: "Unauthorized"
      description: "未登录或登录态 Cookie 已过期，客户端应重新登录"
    - code: 40003
      name: "Permission Denied"
      description: "权限不足，禁止访问该资源"
    - code: 50000
      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "查询手术设计列表"
    apiName: "querySurgicalDesign"
    description: "按患者姓名、设计状态、审批状态分页查询设计列表。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14001"
        description: "网关分发指令，CommandId.QuerySurgicalDesignList = 14001"
    gateway:
      enabled: true
      command: "14001"
      description: "网关分发指令，CommandId.QuerySurgicalDesignList = 14001"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        pageIndex: 1
        pageSize: 10
        name: "{{patientName}}"
        status: 1
        approveStatus: 1
      raw: "{\n  \"pageIndex\": 1,\n  \"pageSize\": 10,\n  \"name\": \"{{patientName}}\",\n  \"status\": 1,\n  \"approveStatus\": 1\n}"
    response:
      example:
        code: 0
        data:
          data: []
          pageIndex: 1
          pageSize: 10
          total: 0
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"data\": [],\n    \"pageIndex\": 1,\n    \"pageSize\": 10,\n    \"total\": 0\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "patientName"
    scripts:
      prerequest: false
      test: true
  - name: "创建设计"
    apiName: "addDesign"
    description: "基于病例创建手术设计。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14002"
        description: "网关分发指令，CommandId.AddSurgicalDesign = 14002"
    gateway:
      enabled: true
      command: "14002"
      description: "网关分发指令，CommandId.AddSurgicalDesign = 14002"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        medicalRecordID: "{{caseId}}"
        modelFileKey: "{{fileKey}}"
      raw: "{\n  \"medicalRecordID\": \"{{caseId}}\",\n  \"modelFileKey\": \"{{fileKey}}\"\n}"
    response:
      example:
        code: 0
        data:
          surgicalDesignID: "design-id"
          version: 0
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"surgicalDesignID\": \"design-id\",\n    \"version\": 0\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "fileKey"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "创建设计 V2"
    apiName: "addDesignV2"
    description: "当前实现与 addDesign 相同，保留为调用入口。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14002"
        description: "网关分发指令，CommandId.AddSurgicalDesign = 14002"
    gateway:
      enabled: true
      command: "14002"
      description: "网关分发指令，CommandId.AddSurgicalDesign = 14002"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        medicalRecordID: "{{caseId}}"
        modelFileKey: "{{fileKey}}"
      raw: "{\n  \"medicalRecordID\": \"{{caseId}}\",\n  \"modelFileKey\": \"{{fileKey}}\"\n}"
    response:
      example:
        code: 0
        data:
          surgicalDesignID: "design-id"
          version: 0
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"surgicalDesignID\": \"design-id\",\n    \"version\": 0\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "fileKey"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "修改设计文件"
    apiName: "changeDesign"
    description: "保存设计内容、缩略图、模型文件和版本信息。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14003"
        description: "网关分发指令，CommandId.UpdateSurgicalDesign = 14003"
    gateway:
      enabled: true
      command: "14003"
      description: "网关分发指令，CommandId.UpdateSurgicalDesign = 14003"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        surgicalDesignID: "{{designId}}"
        version: 0
        content: "{}"
        FDINotation:
          - "11"
        modelFileKey: "{{fileKey}}"
        extraModelFileKeys: []
        thumbnail: "{{thumbnailFileKey}}"
        images: {}
      raw: "{\n  \"surgicalDesignID\": \"{{designId}}\",\n  \"version\": 0,\n  \"content\": \"{}\",\n  \"FDINotation\": [\n    \"11\"\n  ],\n  \"modelFileKey\": \"{{fileKey}}\",\n  \"extraModelFileKeys\": [],\n  \"thumbnail\": \"{{thumbnailFileKey}}\",\n  \"images\": {}\n}"
    response:
      example:
        code: 0
        data:
          version: 1
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"version\": 1\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "designId"
      - "fileKey"
      - "gatewayUrl"
      - "thumbnailFileKey"
    scripts:
      prerequest: true
      test: true
  - name: "导航页修改设计文件"
    apiName: "navChangeDesign"
    description: "导航页保存设计内容，使用独立 Command。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14009"
        description: "网关分发指令，CommandId.NavSurgicalDesign = 14009"
    gateway:
      enabled: true
      command: "14009"
      description: "网关分发指令，CommandId.NavSurgicalDesign = 14009"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        surgicalDesignID: "{{designId}}"
        version: 0
        content: "{}"
        FDINotation:
          - "11"
      raw: "{\n  \"surgicalDesignID\": \"{{designId}}\",\n  \"version\": 0,\n  \"content\": \"{}\",\n  \"FDINotation\": [\n    \"11\"\n  ]\n}"
    response:
      example:
        code: 0
        data:
          version: 1
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"version\": 1\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "designId"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "完成手术设计"
    apiName: "completeDesign"
    description: "提交设计内容并标记设计完成。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14004"
        description: "网关分发指令，CommandId.CompleteSurgicalDesign = 14004"
    gateway:
      enabled: true
      command: "14004"
      description: "网关分发指令，CommandId.CompleteSurgicalDesign = 14004"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        surgicalDesignID: "{{designId}}"
        version: 1
        content: "{}"
      raw: "{\n  \"surgicalDesignID\": \"{{designId}}\",\n  \"version\": 1,\n  \"content\": \"{}\"\n}"
    response:
      example:
        code: 0
        data: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {},\n  \"message\": \"success\"\n}"
    variables:
      - "designId"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "查询设计详情"
    apiName: "queryDesignDetail"
    description: "按 SurgicalDesignID 获取设计详情、患者信息、病例信息和模型文件信息。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14005"
        description: "网关分发指令，CommandId.QuerySurgicalDesignDetail = 14005"
    gateway:
      enabled: true
      command: "14005"
      description: "网关分发指令，CommandId.QuerySurgicalDesignDetail = 14005"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        SurgicalDesignID: "{{designId}}"
      raw: "{\n  \"SurgicalDesignID\": \"{{designId}}\"\n}"
    response:
      example:
        code: 0
        data:
          surgicalDesignDetail:
            ID: "design-id"
            Version: 0
            Status: 1
          patientInfo:
            id: "patient-id"
            name: "张三"
          medicalRecordInfo:
            id: "case-id"
          modelFileKey: "file-key"
          extraModelFileKeys: []
          token: "download-token"
          files: []
          jawType: "upper"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"surgicalDesignDetail\": {\n      \"ID\": \"design-id\",\n      \"Version\": 0,\n      \"Status\": 1\n    },\n    \"patientInfo\": {\n      \"id\": \"patient-id\",\n      \"name\": \"张三\"\n    },\n    \"medicalRecordInfo\": {\n      \"id\": \"case-id\"\n    },\n    \"modelFileKey\": \"file-key\",\n    \"extraModelFileKeys\": [],\n    \"token\": \"download-token\",\n    \"files\": [],\n    \"jawType\": \"upper\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "designId"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "开始手术"
    apiName: "startSurgical"
    description: "将设计进入手术中状态并返回设计详情。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14006"
        description: "网关分发指令，CommandId.StartSurgical = 14006"
    gateway:
      enabled: true
      command: "14006"
      description: "网关分发指令，CommandId.StartSurgical = 14006"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        surgicalDesignID: "{{designId}}"
      raw: "{\n  \"surgicalDesignID\": \"{{designId}}\"\n}"
    response:
      example:
        code: 0
        data:
          surgicalDesignDetail:
            ID: "design-id"
            Status: 3
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"surgicalDesignDetail\": {\n      \"ID\": \"design-id\",\n      \"Status\": 3\n    }\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "designId"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "完成手术"
    apiName: "finishSurgical"
    description: "提交手术完成信息和偏差信息。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "14007"
        description: "网关分发指令，CommandId.FinishSurgical = 14007"
    gateway:
      enabled: true
      command: "14007"
      description: "网关分发指令，CommandId.FinishSurgical = 14007"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        SurgicalDesignID: "{{designId}}"
        SurgicalInfo:
          registration:
            handpieces: null
            jaw: null
          navigation:
            horizontalDeviationMin: null
            depthDeviationMin: null
            axialDeviationMin: null
      raw: "{\n  \"SurgicalDesignID\": \"{{designId}}\",\n  \"SurgicalInfo\": {\n    \"registration\": {\n      \"handpieces\": null,\n      \"jaw\": null\n    },\n    \"navigation\": {\n      \"horizontalDeviationMin\": null,\n      \"depthDeviationMin\": null,\n      \"axialDeviationMin\": null\n    }\n  }\n}"
    response:
      example:
        code: 0
        data:
          content: "{}"
          status: 4
          ApproveStatus: 1
          ModelFile: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"content\": \"{}\",\n    \"status\": 4,\n    \"ApproveStatus\": 1,\n    \"ModelFile\": {}\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "designId"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "获取系统设置"
    apiName: "getSetting"
    description: "获取帮助课程、钻针配置和功能配置。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "GET"
    url: "{{baseUrl}}/settings"
    resolvedUrl: "http://localhost:3000/tars/v1/settings"
    headers: []
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        data:
          Courses: []
          Drills: []
          FeatureConfig: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"Courses\": [],\n    \"Drills\": [],\n    \"FeatureConfig\": {}\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "baseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "删除手术设计"
    apiName: "delDesign"
    description: "按设计 ID 删除设计。"
    group: "手术设计"
    source: "src/api/design/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
