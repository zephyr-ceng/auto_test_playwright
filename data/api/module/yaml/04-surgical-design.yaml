    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        id: "{{designId}}"
      raw: "{\n  \"id\": \"{{designId}}\"\n}"
    response:
      example:
        code: 0
        data:
          code: 0
          message: "success"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"code\": 0,\n    \"message\": \"success\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "designId"
      - "gatewayUrl"
    scripts:
