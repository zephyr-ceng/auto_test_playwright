      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "聊天补全流"
    apiName: "addChat"
    description: "调用聊天节点 /api/v3/bots/chat/completions，返回 stream。"
    group: "聊天与助手"
    source: "src/api/chat/index.ts"
    method: "POST"
    url: "{{chatBaseUrl}}/bots/chat/completions"
    resolvedUrl: "http://192.168.2.159:9999/api/v3/bots/chat/completions"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        model: "test"
        messages:
          - role: "user"
            content: "你好"
        stream: true
        patients_info: []
        machine_info:
          lamp_brightness: 50
        cur_patients_info: null
      raw: "{\n  \"model\": \"test\",\n  \"messages\": [\n    {\n      \"role\": \"user\",\n      \"content\": \"你好\"\n    }\n  ],\n  \"stream\": true,\n  \"patients_info\": [],\n  \"machine_info\": {\n    \"lamp_brightness\": 50\n  },\n  \"cur_patients_info\": null\n}"
    response:
      example:
        choices:
          - delta:
              content: "你好"
            finish_reason: null
      raw: "{\n  \"choices\": [\n    {\n      \"delta\": {\n        \"content\": \"你好\"\n      },\n      \"finish_reason\": null\n    }\n  ]\n}"
    variables:
      - "chatBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "全局助手 SSE"
    apiName: "fetchEventSourceChatCompletions"
    description: "全局助手使用 fetchEventSource 请求 /tars/v1/chat_completions，响应 text/event-stream。"
    group: "聊天与助手"
    source: "src/layout/GlobalWin/index.tsx"
    method: "POST"
    url: "{{baseUrl}}/chat_completions"
    resolvedUrl: "http://localhost:3000/tars/v1/chat_completions"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        model: "test"
        stream: true
        metadata:
          patients_info: []
          cur_patient_info: null
          machine_info:
            lamp_brightness: 50
          is_audio: true
        messages:
          - role: "user"
            content: "调亮无影灯"
      raw: "{\n  \"model\": \"test\",\n  \"stream\": true,\n  \"metadata\": {\n    \"patients_info\": [],\n    \"cur_patient_info\": null,\n    \"machine_info\": {\n      \"lamp_brightness\": 50\n    },\n    \"is_audio\": true\n  },\n  \"messages\": [\n    {\n      \"role\": \"user\",\n      \"content\": \"调亮无影灯\"\n    }\n  ]\n}"
    response:
      example: "data: {\"choices\":[{\"delta\":{\"content\":\"ok\"},\"finish_reason\":null}]}\\n\\ndata: [DONE]"
      raw: "data: {\"choices\":[{\"delta\":{\"content\":\"ok\"},\"finish_reason\":null}]}\\n\\ndata: [DONE]"
    variables:
      - "baseUrl"
    scripts:
      prerequest: false
      test: true
