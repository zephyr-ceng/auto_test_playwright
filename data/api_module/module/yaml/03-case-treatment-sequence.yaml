apiSpecVersion: "1.0.0"
kind: "TarsModuleApiDocument"
source:
  descriptionFile: "api-docs/api-build.md"
  projectCollection: "api-docs/apifox-collection.postman.json"
  sharedEnvironment: "api-docs/apifox-shared-environment.postman_environment.json"
  generatedAt: "2026-06-24"
module:
  index: 3
  name: "病例与治疗序列"
  description: "病例新增、更新、删除和治疗阶段维护。"
  markdown: "md/03-case-treatment-sequence.md"
  yaml: "yaml/03-case-treatment-sequence.yaml"
environment:
  frontendBaseUrl: "http://localhost:3000"
  baseUrl: "http://localhost:3000/tars/v1"
  gatewayUrl: "http://localhost:3000/tars/v1/gateway"
  controlNodeBaseUrl: "http://192.168.0.52:38080/tars/v1"
  rosBaseUrl: "http://192.168.0.52:38081/ros_api/v1"
  chatBaseUrl: "http://192.168.2.159:9999/api/v3"
conventions:
  encoding: "UTF-8"
  defaultContentType: "application/json"
  auth: "登录成功后通过 Set-Cookie 获取 session；后续接口由 Cookie Jar 或 Apifox Cookie 管理器携带登录态。"
  gateway: "网关接口固定请求 {{gatewayUrl}}，通过小写 command 请求头区分业务指令。"
  businessStatusCodes:
    - code: 0
      name: "Success"
      description: "请求成功且业务逻辑处理正常"
    - code: 40001
      name: "Unauthorized"
      description: "未登录或登录态 Cookie 已过期，客户端应重新登录"
    - code: 40003
      name: "Permission Denied"
      description: "权限不足，禁止访问该资源"
    - code: 50000
      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "新增病例"
    apiName: "addCase"
    description: "为患者新增病例记录。"
    group: "病例与治疗序列"
    source: "src/api/case/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "15001"
        description: "网关分发指令，CommandId.AddCase = 15001"
    gateway:
      enabled: true
      command: "15001"
      description: "网关分发指令，CommandId.AddCase = 15001"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        patientID: "{{patientId}}"
        FDINotations:
          - "11"
          - "12"
        record: "术前检查记录"
        tags: []
        diagnosis: "edentulous_jaw"
      raw: "{\n  \"patientID\": \"{{patientId}}\",\n  \"FDINotations\": [\n    \"11\",\n    \"12\"\n  ],\n  \"record\": \"术前检查记录\",\n  \"tags\": [],\n  \"diagnosis\": \"edentulous_jaw\"\n}"
    response:
      example:
        code: 0
        data:
          id: "{{caseId}}"
          patientID: "{{patientId}}"
          FDINotations:
            - "11"
            - "12"
          record: "术前检查记录"
          status: 1
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"id\": \"{{caseId}}\",\n    \"patientID\": \"{{patientId}}\",\n    \"FDINotations\": [\n      \"11\",\n      \"12\"\n    ],\n    \"record\": \"术前检查记录\",\n    \"status\": 1\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "gatewayUrl"
      - "patientId"
    scripts:
      prerequest: true
      test: true
  - name: "更新病例"
    apiName: "updateCase"
    description: "更新病例记录；当前代码同样使用 Command 15001。"
    group: "病例与治疗序列"
    source: "src/api/case/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "15001"
        description: "网关分发指令，CommandId.AddCase = 15001"
    gateway:
      enabled: true
      command: "15001"
      description: "网关分发指令，CommandId.AddCase = 15001"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        id: "{{caseId}}"
        patientID: "{{patientId}}"
        FDINotations:
          - "11"
        record: "复诊记录"
        status: 2
        tags: []
        diagnosis: ""
      raw: "{\n  \"id\": \"{{caseId}}\",\n  \"patientID\": \"{{patientId}}\",\n  \"FDINotations\": [\n    \"11\"\n  ],\n  \"record\": \"复诊记录\",\n  \"status\": 2,\n  \"tags\": [],\n  \"diagnosis\": \"\"\n}"
    response:
      example:
        code: 0
        data:
          id: "case-id"
          status: 2
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"id\": \"case-id\",\n    \"status\": 2\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "gatewayUrl"
      - "patientId"
    scripts:
      prerequest: true
      test: true
  - name: "删除病例"
    apiName: "deleteCase"
    description: "按病例 ID 删除病例。"
    group: "病例与治疗序列"
    source: "src/api/case/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "15002"
        description: "网关分发指令，CommandId.DelCase = 15002"
    gateway:
      enabled: true
      command: "15002"
      description: "网关分发指令，CommandId.DelCase = 15002"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        id: "{{caseId}}"
      raw: "{\n  \"id\": \"{{caseId}}\"\n}"
    response:
      example:
        code: 0
        data:
          code: 0
          message: "success"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"code\": 0,\n    \"message\": \"success\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "新增治疗阶段"
    apiName: "treatmentSequence"
    description: "添加治疗阶段或治疗方案节点。"
    group: "病例与治疗序列"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "15003"
        description: "网关分发指令，CommandId.TreatmentSequence = 15003"
    gateway:
      enabled: true
      command: "15003"
      description: "网关分发指令，CommandId.TreatmentSequence = 15003"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        name: "一期手术"
        date: 1710000000000
        description: "治疗说明"
        status: 1
        medicalRecordID: "{{caseId}}"
        order: 1
      raw: "{\n  \"name\": \"一期手术\",\n  \"date\": 1710000000000,\n  \"description\": \"治疗说明\",\n  \"status\": 1,\n  \"medicalRecordID\": \"{{caseId}}\",\n  \"order\": 1\n}"
    response:
      example:
        code: 0
        data:
          id: "treatment-id"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"id\": \"treatment-id\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "gatewayUrl"
    scripts:
      prerequest: true
      test: true
  - name: "更新治疗阶段"
    apiName: "changeTreatmentSequence"
    description: "更新治疗阶段名称、日期、描述和状态。"
    group: "病例与治疗序列"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "15003"
        description: "网关分发指令，CommandId.TreatmentSequence = 15003"
    gateway:
      enabled: true
      command: "15003"
      description: "网关分发指令，CommandId.TreatmentSequence = 15003"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        id: "{{treatmentId}}"
        name: "一期手术"
        date: 1710000000000
        description: "更新说明"
        status: 1
        medicalRecordID: "{{caseId}}"
      raw: "{\n  \"id\": \"{{treatmentId}}\",\n  \"name\": \"一期手术\",\n  \"date\": 1710000000000,\n  \"description\": \"更新说明\",\n  \"status\": 1,\n  \"medicalRecordID\": \"{{caseId}}\"\n}"
    response:
      example:
        code: 0
        data: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {},\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "gatewayUrl"
      - "treatmentId"
    scripts:
      prerequest: true
      test: true
  - name: "治疗阶段排序"
    apiName: "sortTreatmentSequence"
    description: "按 treatmentsOrders 调整治疗阶段顺序。"
    group: "病例与治疗序列"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "15005"
        description: "网关分发指令，CommandId.sortTreatmentSequence = 15005"
    gateway:
      enabled: true
      command: "15005"
      description: "网关分发指令，CommandId.sortTreatmentSequence = 15005"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        medicalRecordID: "{{caseId}}"
        treatmentsOrders:
          - "{{treatmentId}}"
      raw: "{\n  \"medicalRecordID\": \"{{caseId}}\",\n  \"treatmentsOrders\": [\n    \"{{treatmentId}}\"\n  ]\n}"
    response:
      example:
        code: 0
        data: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {},\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "gatewayUrl"
      - "treatmentId"
    scripts:
      prerequest: true
      test: true
  - name: "删除治疗阶段"
    apiName: "delTreatmentSequence"
    description: "删除某个治疗阶段。"
    group: "病例与治疗序列"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "15004"
        description: "网关分发指令，CommandId.DelTreatmentSequence = 15004"
    gateway:
      enabled: true
      command: "15004"
      description: "网关分发指令，CommandId.DelTreatmentSequence = 15004"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        medicalRecordID: "{{caseId}}"
        id: "{{treatmentId}}"
      raw: "{\n  \"medicalRecordID\": \"{{caseId}}\",\n  \"id\": \"{{treatmentId}}\"\n}"
    response:
      example:
        code: 0
        data: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {},\n  \"message\": \"success\"\n}"
    variables:
      - "caseId"
      - "gatewayUrl"
      - "treatmentId"
    scripts:
      prerequest: true
      test: true
