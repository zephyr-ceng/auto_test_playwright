conventions:
  encoding: "UTF-8"
  defaultContentType: "application/json"
  auth: "登录成功后通过 Set-Cookie 获取 session；后续接口由 Cookie Jar 或 Apifox Cookie 管理器携带登录态。"
  gateway: "网关接口固定请求 {{gatewayUrl}}，通过小写 command 请求头区分业务指令。"
  businessStatusCodes:
    - code: 0
      name: "Success"
      description: "请求成功且业务逻辑处理正常"
    - code: 40001
      name: "Unauthorized"
      description: "未登录或登录态 Cookie 已过期，客户端应重新登录"
    - code: 40003
      name: "Permission Denied"
      description: "权限不足，禁止访问该资源"
    - code: 50000
      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "获取积分总览"
    apiName: "getPointSummary"
    description: "获取个人、租户、手术和冻结积分。"
    group: "积分"
    source: "src/api/points/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "20002"
        description: "网关分发指令，CommandId.GetPointSummary = 20002"
    gateway:
      enabled: true
      command: "20002"
      description: "网关分发指令，CommandId.GetPointSummary = 20002"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        userId: "{{userId}}"
        tenantId: "{{tenantId}}"
      raw: "{\n  \"userId\": \"{{userId}}\",\n  \"tenantId\": \"{{tenantId}}\"\n}"
    response:
      example:
        code: 0
        data:
          vipLevel: 1
          userName: "管理员"
          tenantName: "诊所"
          personalPoint: 100
          personalSurgeryPoint: 20
          tenantPoint: 1000
          freezePoint: 0
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"vipLevel\": 1,\n    \"userName\": \"管理员\",\n    \"tenantName\": \"诊所\",\n    \"personalPoint\": 100,\n    \"personalSurgeryPoint\": 20,\n    \"tenantPoint\": 1000,\n    \"freezePoint\": 0\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "tenantId"
      - "userId"
    scripts:
      prerequest: true
      test: true
