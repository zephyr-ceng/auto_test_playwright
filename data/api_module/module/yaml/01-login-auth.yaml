apiSpecVersion: "1.0.0"
kind: "TarsModuleApiDocument"
source:
  descriptionFile: "api-docs/api-build.md"
  projectCollection: "api-docs/apifox-collection.postman.json"
  sharedEnvironment: "api-docs/apifox-shared-environment.postman_environment.json"
  generatedAt: "2026-06-24"
module:
  index: 1
  name: "登录认证"
  description: "登录、登出、短信验证码、密码重置和当前用户信息。"
  markdown: "md/01-login-auth.md"
  yaml: "yaml/01-login-auth.yaml"
environment:
  frontendBaseUrl: "http://localhost:3000"
  baseUrl: "http://localhost:3000/tars/v1"
  gatewayUrl: "http://localhost:3000/tars/v1/gateway"
  controlNodeBaseUrl: "http://192.168.0.52:38080/tars/v1"
  rosBaseUrl: "http://192.168.0.52:38081/ros_api/v1"
  chatBaseUrl: "http://192.168.2.159:9999/api/v3"
conventions:
  encoding: "UTF-8"
  defaultContentType: "application/json"
  auth: "登录成功后通过 Set-Cookie 获取 session；后续接口由 Cookie Jar 或 Apifox Cookie 管理器携带登录态。"
  gateway: "网关接口固定请求 {{gatewayUrl}}，通过小写 command 请求头区分业务指令。"
  businessStatusCodes:
    - code: 0
      name: "Success"
      description: "请求成功且业务逻辑处理正常"
    - code: 40001
      name: "Unauthorized"
      description: "未登录或登录态 Cookie 已过期，客户端应重新登录"
    - code: 40003
      name: "Permission Denied"
      description: "权限不足，禁止访问该资源"
    - code: 50000
      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "用户名密码登录"
    apiName: "loginByUserName"
    description: "使用 username/password 登录，可通过 returnToken 要求后端返回 token。"
    group: "登录认证"
    source: "src/api/login/index.ts"
    method: "POST"
    url: "{{baseUrl}}/login_by_username"
    resolvedUrl: "http://localhost:3000/tars/v1/login_by_username"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: false
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        username: "{{username}}"
        password: "{{password}}"
        returnToken: false
      raw: "{\n  \"username\": \"{{username}}\",\n  \"password\": \"{{password}}\",\n  \"returnToken\": false\n}"
    response:
      example:
        code: 0
        data:
          accountID: "account-id"
          name: "管理员"
          tenantID: "tenant-id"
          tenantType: "clinic"
          userID: "user-id"
          username: "admin"
          token: ""
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"accountID\": \"account-id\",\n    \"name\": \"管理员\",\n    \"tenantID\": \"tenant-id\",\n    \"tenantType\": \"clinic\",\n    \"userID\": \"user-id\",\n    \"username\": \"admin\",\n    \"token\": \"\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "baseUrl"
      - "password"
      - "username"
    scripts:
      prerequest: true
      test: true
  - name: "登出"
    apiName: "logout"
    description: "退出当前登录会话。"
    group: "登录认证"
    source: "src/api/login/index.ts"
    method: "POST"
    url: "{{baseUrl}}/logout"
    resolvedUrl: "http://localhost:3000/tars/v1/logout"
    headers: []
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"message\": \"success\"\n}"
    variables:
      - "baseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "手机号验证码登录"
    apiName: "loginByTel"
    description: "使用 telephone/code 登录，可通过 returnToken 要求后端返回 token。"
    group: "登录认证"
    source: "src/api/login/index.ts"
    method: "POST"
    url: "{{baseUrl}}/login_by_telephone"
    resolvedUrl: "http://localhost:3000/tars/v1/login_by_telephone"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        telephone: "13800138000"
        code: "123456"
        returnToken: true
      raw: "{\n  \"telephone\": \"13800138000\",\n  \"code\": \"123456\",\n  \"returnToken\": true\n}"
    response:
      example:
        code: 0
        data:
          accountID: "account-id"
          name: "用户"
          tenantID: "tenant-id"
          userID: "user-id"
          token: "token-if-returnToken"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"accountID\": \"account-id\",\n    \"name\": \"用户\",\n    \"tenantID\": \"tenant-id\",\n    \"userID\": \"user-id\",\n    \"token\": \"token-if-returnToken\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "baseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "发送短信验证码"
    apiName: "sendSMS"
    description: "发送登录或重置密码短信验证码。"
    group: "登录认证"
    source: "src/api/login/index.ts"
    method: "POST"
    url: "{{baseUrl}}/send_sms"
    resolvedUrl: "http://localhost:3000/tars/v1/send_sms"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: false
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        telephone: "13800138000"
        type: "login"
      raw: "{\n  \"telephone\": \"13800138000\",\n  \"type\": \"login\"\n}"
    response:
      example:
        code: 0
        data: "sms-id-or-message"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": \"sms-id-or-message\",\n  \"message\": \"success\"\n}"
    variables:
      - "baseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "重置密码"
    apiName: "resetPassword"
    description: "通过手机号验证码重置密码。"
    group: "登录认证"
    source: "src/api/login/index.ts"
    method: "POST"
    url: "{{baseUrl}}/reset_password"
    resolvedUrl: "http://localhost:3000/tars/v1/reset_password"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        telephone: "13800138000"
        code: "123456"
        newPassword: "new-password"
      raw: "{\n  \"telephone\": \"13800138000\",\n  \"code\": \"123456\",\n  \"newPassword\": \"new-password\"\n}"
    response:
      example:
        code: 0
        data: "ok"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": \"ok\",\n  \"message\": \"success\"\n}"
    variables:
      - "baseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "获取当前用户信息"
    apiName: "getUserInfo"
    description: "通过网关 Command 获取当前登录用户信息。"
    group: "登录认证"
    source: "src/api/login/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "command"
        value: "16001"
        description: "网关分发指令，CommandId.GetUserInfo = 16001"
    gateway:
      enabled: true
      command: "16001"
      description: "网关分发指令，CommandId.GetUserInfo = 16001"
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        data:
          AccountID: "account-id"
          ID: "user-id"
          Name: "管理员"
          TenantID: "tenant-id"
          TenantType: "clinic"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"AccountID\": \"account-id\",\n    \"ID\": \"user-id\",\n    \"Name\": \"管理员\",\n    \"TenantID\": \"tenant-id\",\n    \"TenantType\": \"clinic\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
    scripts:
      prerequest: false
      test: true
