endpoints:
  - name: "获取植体系统列表"
    apiName: "getImplantSystemAPI"
    description: "获取本地植体/钻针系统配置。"
    group: "植体系统"
    source: "src/api/implant/index.ts"
    method: "GET"
    url: "{{controlNodeBaseUrl}}/implant_system"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/implant_system"
    headers: []
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        data:
          - id: 1
            name: "implant-system"
            systems: []
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": [\n    {\n      \"id\": 1,\n      \"name\": \"implant-system\",\n      \"systems\": []\n    }\n  ],\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "获取植体收藏"
    apiName: "getImplantFavorites"
    description: "获取当前用户收藏的植体类型。"
    group: "植体系统"
    source: "src/api/implant/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "command"
        value: "18004"
        description: "网关分发指令，CommandId.GetImplantFavorites = 18004"
    gateway:
      enabled: true
      command: "18004"
      description: "网关分发指令，CommandId.GetImplantFavorites = 18004"
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        data:
          favorites:
            - "implant-type"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"favorites\": [\n      \"implant-type\"\n    ]\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
    scripts:
      prerequest: false
      test: true
  - name: "新增植体收藏"
    apiName: "addImplantFavorite"
    description: "收藏指定植体类型。"
    group: "植体系统"
    source: "src/api/implant/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "18005"
        description: "网关分发指令，CommandId.AddImplantFavorite = 18005"
    gateway:
      enabled: true
      command: "18005"
      description: "网关分发指令，CommandId.AddImplantFavorite = 18005"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        type: "implant-type"
      raw: "{\n  \"type\": \"implant-type\"\n}"
    response:
      example:
        code: 0
        data: true
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": true,\n  \"message\": \"success\"\n}"
