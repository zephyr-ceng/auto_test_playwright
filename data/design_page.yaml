locators:
  # _dcm_upload
  import_data: "button:has-text('导入数据')"
  import_model: "button:has-text('导入模型文件 (.STL, .DCM)')"
  input_dcm_name: '//input[@placeholder="输入模型名称"]'
  confirmed_btn: "button:has-text('确 认')"

  # _input_label / _create_tooth
  input_label: "div.ant-select-content:visible"
  input_combobox: 'combobox'
  new_case_button: "button:has-text('新增病例')"
  tooth_path_template: "[role='dialog'] svg path[data-name='{tooth_position}']"
  save_button: "button:has-text('保 存')"
  cancel_button: "button:has-text('取 消')"
  create_tooth_msg: "div.ant-message-notice-content"

  # 预留/病例卡片
  case_card: "//div[contains(@class,'bg-[#232323]')]"

  # _read_case_tooth_positions
  case_tooth_position_cards: "xpath=//div[contains(@class,'_medicalRecordPlane')]//div[contains(@class,'cursor-pointer') and .//span[contains(@class,'text-base')]]"

  # treatment_path_manager / get_current_surgical_path
  tooth_label_template: "span:has-text('{tooth_position}')"

  # _drag_surgical / _dragg_surgical
  surgical_stage_draggable_cards: "div[draggable='true']:visible"

  # create_design_and_wait_progress
  create_design_button: "创建设计"
  progressbar: "[role='progressbar']"
  tool_button: "div._tool-btn_m3ugk_1"

  # select_implant
  implant_tooth_path_template: "[role='dialog'] svg path[data-name='{tooth_position}']"
  select_implant_button: "选择植体"
  final_confirm_button: "button:has-text('确 定')"

  # skip_apex_adjustment
  next_apex_button_text: "下一步：选择牙尖点"
  finish_adjustment_button_text: "完成调整"
  skip_button_text: "暂时不用"

  # 预留/当前未调用
  treatment_path_title: "xpath=//div[contains(@class,'_treatmentPathway_')]//div[normalize-space()='治疗路径']"
  patient_data_item: "text=术前CT"
  case_card_template: "xpath=//div[contains(@class,'_medicalRecordPlane')]//*[normalize-space()='{case_no}']"
  add_treatment_button: "button:has-text('添加流程')"
  add_treatment_submit_button: "button:has-text('添加流程')"
  add_treatment_title_input: "input[placeholder='请输入治疗标题']"
  add_treatment_date_input: "input[placeholder='请选择日期']"
  add_treatment_remark_textarea: "textarea[placeholder='请备注相关的信息']"

  # treatment_stage_* 预留/当前未调用
  treatment_stage_cards: "div[class*='_treatment_']"
  treatment_stage_edit_button_template: "xpath=(//*[normalize-space()='治疗路径']/following::*[normalize-space()='{stage_index}'][1]/following::button)[1]"
  treatment_stage_delete_button_template: "xpath=(//*[normalize-space()='治疗路径']/following::*[normalize-space()='{stage_index}'][1]/following::button)[2]"
  treatment_stage_title_input: "input[placeholder='请输入治疗标题']"
  treatment_stage_status_combobox: "input[role='combobox']"
  treatment_stage_status_options: ".ant-select-dropdown:visible .ant-select-item-option"
  treatment_stage_date_input: "input[placeholder='请选择日期']"
  treatment_stage_remark_textarea: "textarea[placeholder='请备注相关的信息']"
  treatment_stage_confirm_button: "button:has-text('确 认')"
  treatment_stage_cancel_button: "button:has-text('取 消')"
  treatment_stage_success_message: "text=操作成功"
  delete_treatment_confirm_button: ".ant-modal button.ant-btn-primary:has-text('确 定')"
