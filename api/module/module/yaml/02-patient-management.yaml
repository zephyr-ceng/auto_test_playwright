apiSpecVersion: "1.0.0"
kind: "TarsModuleApiDocument"
source:
  descriptionFile: "api-docs/api-build.md"
  projectCollection: "api-docs/apifox-collection.postman.json"
  sharedEnvironment: "api-docs/apifox-shared-environment.postman_environment.json"
  generatedAt: "2026-06-24"
module:
  index: 2
  name: "患者管理"
  description: "患者新增、更新、查询、删除和模型文件绑定。"
  markdown: "md/02-patient-management.md"
  yaml: "yaml/02-patient-management.yaml"
environment:
  frontendBaseUrl: "http://localhost:3000"
  baseUrl: "http://localhost:3000/tars/v1"
  gatewayUrl: "http://localhost:3000/tars/v1/gateway"
  controlNodeBaseUrl: "http://192.168.0.52:38080/tars/v1"
  rosBaseUrl: "http://192.168.0.52:38081/ros_api/v1"
  chatBaseUrl: "http://192.168.2.159:9999/api/v3"
conventions:
  encoding: "UTF-8"
  defaultContentType: "application/json"
  auth: "登录成功后通过 Set-Cookie 获取 session；后续接口由 Cookie Jar 或 Apifox Cookie 管理器携带登录态。"
  gateway: "网关接口固定请求 {{gatewayUrl}}，通过小写 command 请求头区分业务指令。"
  businessStatusCodes:
    - code: 0
      name: "Success"
      description: "请求成功且业务逻辑处理正常"
    - code: 40001
      name: "Unauthorized"
      description: "未登录或登录态 Cookie 已过期，客户端应重新登录"
    - code: 40003
      name: "Permission Denied"
      description: "权限不足，禁止访问该资源"
    - code: 50000
      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "新增患者"
    apiName: "savePatient"
    description: "创建患者基础信息。"
    group: "患者管理"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "13002"
        description: "网关分发指令，CommandId.SavePatient = 13002"
    gateway:
      enabled: true
      command: "13002"
      description: "网关分发指令，CommandId.SavePatient = 13002"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        name: "{{patientName}}"
        gender: 1
        dateOfBirth: 631123200000
        identityCard: "{{patientIdentityCard}}"
        telephone: "{{patientTelephone}}"
        desc: ""
      raw: "{\n  \"name\": \"{{patientName}}\",\n  \"gender\": 1,\n  \"dateOfBirth\": 631123200000,\n  \"identityCard\": \"{{patientIdentityCard}}\",\n  \"telephone\": \"{{patientTelephone}}\",\n  \"desc\": \"\"\n}"
    response:
      example:
        code: 0
        data:
          id: "patient-id"
          name: "张三"
          gender: 1
          dateOfBirth: 631123200000
          identityCard: "110101199001010011"
          telephone: "13800138000"
          desc: ""
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"id\": \"patient-id\",\n    \"name\": \"张三\",\n    \"gender\": 1,\n    \"dateOfBirth\": 631123200000,\n    \"identityCard\": \"110101199001010011\",\n    \"telephone\": \"13800138000\",\n    \"desc\": \"\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "patientIdentityCard"
      - "patientName"
      - "patientTelephone"
    scripts:
      prerequest: true
      test: true
  - name: "更新患者"
    apiName: "updatePatient"
    description: "更新患者姓名和电话等基础信息。"
    group: "患者管理"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "13003"
        description: "网关分发指令，CommandId.UpdatePatient = 13003"
    gateway:
      enabled: true
      command: "13003"
      description: "网关分发指令，CommandId.UpdatePatient = 13003"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        id: "{{patientId}}"
        name: "{{patientName}}"
        gender: 1
        dateOfBirth: 631123200000
        identityCard: "{{patientIdentityCard}}"
        telephone: "{{patientTelephone}}"
        desc: ""
      raw: "{\n  \"id\": \"{{patientId}}\",\n  \"name\": \"{{patientName}}\",\n  \"gender\": 1,\n  \"dateOfBirth\": 631123200000,\n  \"identityCard\": \"{{patientIdentityCard}}\",\n  \"telephone\": \"{{patientTelephone}}\",\n  \"desc\": \"\"\n}"
    response:
      example:
        code: 0
        data: null
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": null,\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "patientId"
      - "patientIdentityCard"
      - "patientName"
      - "patientTelephone"
    scripts:
      prerequest: true
      test: true
  - name: "分页查询患者"
    apiName: "queryPatientPage"
    description: "按姓名、性别、电话分页查询患者。"
    group: "患者管理"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "13001"
        description: "网关分发指令，CommandId.QueryPatientPage = 13001"
    gateway:
      enabled: true
      command: "13001"
      description: "网关分发指令，CommandId.QueryPatientPage = 13001"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        pageIndex: 1
        pageSize: 10
        name: "{{patientName}}"
        gender: 1
        telephone: "{{patientTelephone}}"
      raw: "{\n  \"pageIndex\": 1,\n  \"pageSize\": 10,\n  \"name\": \"{{patientName}}\",\n  \"gender\": 1,\n  \"telephone\": \"{{patientTelephone}}\"\n}"
    response:
      example:
        code: 0
        data:
          data: []
          pageIndex: 1
          pageSize: 10
          total: 0
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"data\": [],\n    \"pageIndex\": 1,\n    \"pageSize\": 10,\n    \"total\": 0\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "patientName"
      - "patientTelephone"
    scripts:
      prerequest: false
      test: true
  - name: "删除患者"
    apiName: "delPatient"
    description: "按患者 ID 删除患者。"
    group: "患者管理"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "13004"
        description: "网关分发指令，CommandId.DeletePatient = 13004"
    gateway:
      enabled: true
      command: "13004"
      description: "网关分发指令，CommandId.DeletePatient = 13004"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        id: "{{patientId}}"
      raw: "{\n  \"id\": \"{{patientId}}\"\n}"
    response:
      example:
        code: 0
        data:
          code: 0
          message: "success"
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"code\": 0,\n    \"message\": \"success\"\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "patientId"
    scripts:
      prerequest: true
      test: true
  - name: "绑定模型文件到患者"
    apiName: "bindModelFileToPatient"
    description: "将已上传文件绑定到患者。"
    group: "患者管理"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "13005"
        description: "网关分发指令，CommandId.bindModelFile = 13005"
    gateway:
      enabled: true
      command: "13005"
      description: "网关分发指令，CommandId.bindModelFile = 13005"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        patientID: "{{patientID}}"
        fileKey: "{{fileKey}}"
        tags:
          - "ct"
        name: "CT.dcm"
        type: "dcm"
        params: "{}"
        jawType: "upper"
        treatmentID: "{{treatmentId}}"
      raw: "{\n  \"patientID\": \"{{patientID}}\",\n  \"fileKey\": \"{{fileKey}}\",\n  \"tags\": [\n    \"ct\"\n  ],\n  \"name\": \"CT.dcm\",\n  \"type\": \"dcm\",\n  \"params\": \"{}\",\n  \"jawType\": \"upper\",\n  \"treatmentID\": \"{{treatmentId}}\"\n}"
    response:
      example:
        code: 0
        data: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {},\n  \"message\": \"success\"\n}"
    variables:
      - "fileKey"
      - "gatewayUrl"
      - "patientID"
      - "treatmentId"
    scripts:
      prerequest: true
      test: true
  - name: "解绑患者模型文件"
    apiName: "unbindModelFileToPatient"
    description: "解除患者与文件的绑定关系。"
    group: "患者管理"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "13006"
        description: "网关分发指令，CommandId.unbindModelFile = 13006"
    gateway:
      enabled: true
      command: "13006"
      description: "网关分发指令，CommandId.unbindModelFile = 13006"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        patientID: "{{patientID}}"
        fileKey: "{{fileKey}}"
      raw: "{\n  \"patientID\": \"{{patientID}}\",\n  \"fileKey\": \"{{fileKey}}\"\n}"
    response:
      example:
        code: 0
        data: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {},\n  \"message\": \"success\"\n}"
    variables:
      - "fileKey"
      - "gatewayUrl"
      - "patientID"
    scripts:
      prerequest: true
      test: true
  - name: "查询患者详情 V2"
    apiName: "searchPatientDetailsMessageV2"
    description: "查询患者详情，固定携带 needFiles 和 needMedicalRecords。"
    group: "患者管理"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "13007"
        description: "网关分发指令，CommandId.SearchPatientV2 = 13007"
    gateway:
      enabled: true
      command: "13007"
      description: "网关分发指令，CommandId.SearchPatientV2 = 13007"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        id: "{{patientID}}"
        needFiles: true
        needMedicalRecords: true
      raw: "{\n  \"id\": \"{{patientID}}\",\n  \"needFiles\": true,\n  \"needMedicalRecords\": true\n}"
    response:
      example:
        code: 0
        data:
          id: "patient-id"
          name: "张三"
          gender: 1
          medicalRecordList: []
          medicalRecords: []
          files: []
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"id\": \"patient-id\",\n    \"name\": \"张三\",\n    \"gender\": 1,\n    \"medicalRecordList\": [],\n    \"medicalRecords\": [],\n    \"files\": []\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "patientID"
    scripts:
      prerequest: true
      test: true
  - name: "变更绑定文件"
    apiName: "changeBindFile"
    description: "变更患者关联文件信息，调用处传入 data，结构以后端约定为准。"
    group: "患者管理"
    source: "src/api/patient/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "13008"
        description: "网关分发指令，CommandId.ChangeBindFile = 13008"
    gateway:
      enabled: true
      command: "13008"
      description: "网关分发指令，CommandId.ChangeBindFile = 13008"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        patientID: "{{patientID}}"
        oldFileKey: "{{oldFileKey}}"
        newFileKey: "{{fileKey}}"
      raw: "{\n  \"patientID\": \"{{patientID}}\",\n  \"oldFileKey\": \"{{oldFileKey}}\",\n  \"newFileKey\": \"{{fileKey}}\"\n}"
    response:
      example:
        code: 0
        data: {}
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {},\n  \"message\": \"success\"\n}"
    variables:
      - "fileKey"
      - "gatewayUrl"
      - "oldFileKey"
      - "patientID"
    scripts:
      prerequest: true
      test: true
