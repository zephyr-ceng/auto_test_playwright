    group: "系统消息与设备"
    source: "src/api/systemMessage/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "19001"
        description: "网关分发指令，CommandId.getMessage = 19001"
    gateway:
      enabled: true
      command: "19001"
      description: "网关分发指令，CommandId.getMessage = 19001"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        pageSize: 10
        current: 1
      raw: "{\n  \"pageSize\": 10,\n  \"current\": 1\n}"
    response:
      example:
        code: 0
