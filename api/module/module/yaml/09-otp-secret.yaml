apiSpecVersion: "1.0.0"
kind: "TarsModuleApiDocument"
source:
  descriptionFile: "api-docs/api-build.md"
  projectCollection: "api-docs/apifox-collection.postman.json"
  sharedEnvironment: "api-docs/apifox-shared-environment.postman_environment.json"
  generatedAt: "2026-06-24"
module:
  index: 9
  name: "OTP 密钥"
  description: "OTP secret 生成、校验、上传、查询和按设备取验证码。"
  markdown: "md/09-otp-secret.md"
  yaml: "yaml/09-otp-secret.yaml"
environment:
  frontendBaseUrl: "http://localhost:3000"
  baseUrl: "http://localhost:3000/tars/v1"
  gatewayUrl: "http://localhost:3000/tars/v1/gateway"
  controlNodeBaseUrl: "http://192.168.0.52:38080/tars/v1"
  rosBaseUrl: "http://192.168.0.52:38081/ros_api/v1"
  chatBaseUrl: "http://192.168.2.159:9999/api/v3"
conventions:
  encoding: "UTF-8"
  defaultContentType: "application/json"
  auth: "登录成功后通过 Set-Cookie 获取 session；后续接口由 Cookie Jar 或 Apifox Cookie 管理器携带登录态。"
  gateway: "网关接口固定请求 {{gatewayUrl}}，通过小写 command 请求头区分业务指令。"
  businessStatusCodes:
    - code: 0
      name: "Success"
      description: "请求成功且业务逻辑处理正常"
    - code: 40001
      name: "Unauthorized"
      description: "未登录或登录态 Cookie 已过期，客户端应重新登录"
    - code: 40003
      name: "Permission Denied"
      description: "权限不足，禁止访问该资源"
    - code: 50000
      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "生成 OTP Secret"
    apiName: "generateOtpSecret"
    description: "按 username 生成或获取当前有效 OTP secret。"
    group: "OTP 密钥"
    source: "src/api/opt/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/otp/generate_secret"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/otp/generate_secret"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        username: "{{username}}"
        serverSecretVersion: 1
      raw: "{\n  \"username\": \"{{username}}\",\n  \"serverSecretVersion\": 1\n}"
    response:
      example:
        code: 0
        data:
          username: "admin"
          hwid: "control-node-hwid"
          secret: "otp-secret"
          otpauth_url: "otpauth://totp/..."
          secretVersion: 1
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"username\": \"admin\",\n    \"hwid\": \"control-node-hwid\",\n    \"secret\": \"otp-secret\",\n    \"otpauth_url\": \"otpauth://totp/...\",\n    \"secretVersion\": 1\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
      - "username"
    scripts:
      prerequest: false
      test: true
  - name: "校验 OTP Code"
    apiName: "verifyOtpCode"
    description: "校验 username 对应的 OTP 动态码。"
    group: "OTP 密钥"
    source: "src/api/opt/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/otp/verify"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/otp/verify"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        username: "{{username}}"
        otp_code: "{{otpCode}}"
      raw: "{\n  \"username\": \"{{username}}\",\n  \"otp_code\": \"{{otpCode}}\"\n}"
    response:
      example:
        code: 0
        data:
          username: "admin"
          valid: true
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"username\": \"admin\",\n    \"valid\": true\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
      - "otpCode"
      - "username"
    scripts:
      prerequest: true
      test: true
  - name: "上传用户 Secret"
    apiName: "uploadUserSecret"
    description: "上传当前用户在当前设备上的 secret。"
    group: "OTP 密钥"
    source: "src/api/opt/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "12002"
        description: "网关分发指令，CommandId.UploadUserSecret = 12002"
    gateway:
      enabled: true
      command: "12002"
      description: "网关分发指令，CommandId.UploadUserSecret = 12002"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        secret: "{{otpSecret}}"
        hwid: "{{hwid}}"
        secretVersion: 1
      raw: "{\n  \"secret\": \"{{otpSecret}}\",\n  \"hwid\": \"{{hwid}}\",\n  \"secretVersion\": 1\n}"
    response:
      example:
        code: 0
        data:
          username: "admin"
          hwid: "control-node-hwid"
          hwidHash: "hwid-hash"
          secretVersion: 1
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"username\": \"admin\",\n    \"hwid\": \"control-node-hwid\",\n    \"hwidHash\": \"hwid-hash\",\n    \"secretVersion\": 1\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "hwid"
      - "otpSecret"
    scripts:
      prerequest: true
      test: true
  - name: "查询用户 Secret 元信息"
    apiName: "getUserSecretMeta"
    description: "查询当前用户在指定设备上的服务端 secret 版本信息。"
    group: "OTP 密钥"
    source: "src/api/opt/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "12003"
        description: "网关分发指令，CommandId.GetUserSecretMeta = 12003"
    gateway:
      enabled: true
      command: "12003"
      description: "网关分发指令，CommandId.GetUserSecretMeta = 12003"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        hwid: "{{hwid}}"
      raw: "{\n  \"hwid\": \"{{hwid}}\"\n}"
    response:
      example:
        code: 0
        data:
          username: "admin"
          hwid: "control-node-hwid"
          hwidHash: "hwid-hash"
          exists: true
          secretVersion: 1
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"username\": \"admin\",\n    \"hwid\": \"control-node-hwid\",\n    \"hwidHash\": \"hwid-hash\",\n    \"exists\": true,\n    \"secretVersion\": 1\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "hwid"
    scripts:
      prerequest: true
      test: true
  - name: "列出 Secret 绑定设备"
    apiName: "listUserSecretDevices"
    description: "列出当前用户服务端已绑定设备，不返回原始 hwid。"
    group: "OTP 密钥"
    source: "src/api/opt/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "command"
        value: "12004"
        description: "网关分发指令，CommandId.ListUserSecretDevices = 12004"
    gateway:
      enabled: true
      command: "12004"
      description: "网关分发指令，CommandId.ListUserSecretDevices = 12004"
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        data:
          username: "admin"
          devices: []
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"username\": \"admin\",\n    \"devices\": []\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
    scripts:
      prerequest: false
      test: true
  - name: "获取用户 OTP Code"
    apiName: "getUserOtpCode"
    description: "按当前用户和设备 hwid 获取对应 secret 生成的当前 OTP 动态码。"
    group: "OTP 密钥"
    source: "src/api/opt/index.ts"
    method: "POST"
    url: "{{gatewayUrl}}"
    resolvedUrl: "http://localhost:3000/tars/v1/gateway"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
      - name: "command"
        value: "12005"
        description: "网关分发指令，CommandId.GetUserOTPCode = 12005"
    gateway:
      enabled: true
      command: "12005"
      description: "网关分发指令，CommandId.GetUserOTPCode = 12005"
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        hwid: "{{hwid}}"
      raw: "{\n  \"hwid\": \"{{hwid}}\"\n}"
    response:
      example:
        code: 0
        data:
          username: "admin"
          hwid: "control-node-hwid"
          hwidHash: "hwid-hash"
          exists: true
          otpCode: "123456"
          secretVersion: 1
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"username\": \"admin\",\n    \"hwid\": \"control-node-hwid\",\n    \"hwidHash\": \"hwid-hash\",\n    \"exists\": true,\n    \"otpCode\": \"123456\",\n    \"secretVersion\": 1\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "gatewayUrl"
      - "hwid"
    scripts:
      prerequest: true
      test: true
