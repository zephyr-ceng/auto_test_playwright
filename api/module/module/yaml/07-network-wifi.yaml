apiSpecVersion: "1.0.0"
kind: "TarsModuleApiDocument"
source:
  descriptionFile: "api-docs/api-build.md"
  projectCollection: "api-docs/apifox-collection.postman.json"
  sharedEnvironment: "api-docs/apifox-shared-environment.postman_environment.json"
  generatedAt: "2026-06-24"
module:
  index: 7
  name: "网络与 Wi-Fi"
  description: "网络速率、Wi-Fi 列表、连接状态和热点开关。"
  markdown: "md/07-network-wifi.md"
  yaml: "yaml/07-network-wifi.yaml"
environment:
  frontendBaseUrl: "http://localhost:3000"
  baseUrl: "http://localhost:3000/tars/v1"
  gatewayUrl: "http://localhost:3000/tars/v1/gateway"
  controlNodeBaseUrl: "http://192.168.0.52:38080/tars/v1"
  rosBaseUrl: "http://192.168.0.52:38081/ros_api/v1"
  chatBaseUrl: "http://192.168.2.159:9999/api/v3"
conventions:
  encoding: "UTF-8"
  defaultContentType: "application/json"
  auth: "登录成功后通过 Set-Cookie 获取 session；后续接口由 Cookie Jar 或 Apifox Cookie 管理器携带登录态。"
  gateway: "网关接口固定请求 {{gatewayUrl}}，通过小写 command 请求头区分业务指令。"
  businessStatusCodes:
    - code: 0
      name: "Success"
      description: "请求成功且业务逻辑处理正常"
    - code: 40001
      name: "Unauthorized"
      description: "未登录或登录态 Cookie 已过期，客户端应重新登录"
    - code: 40003
      name: "Permission Denied"
      description: "权限不足，禁止访问该资源"
    - code: 50000
      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "获取网络实时速率"
    apiName: "getNetworkRealtimeRate"
    description: "查询有线/Wi-Fi/无网络状态及上下行速率。"
    group: "网络与 Wi-Fi"
    source: "src/api/network/index.ts"
    method: "GET"
    url: "{{controlNodeBaseUrl}}/network_status"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/network_status"
    headers: []
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        data:
          networkType: "wifi"
          downloadSpeed: 1024
          uploadSpeed: 512
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"networkType\": \"wifi\",\n    \"downloadSpeed\": 1024,\n    \"uploadSpeed\": 512\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "扫描 Wi-Fi 列表"
    apiName: "getWifiListAPI"
    description: "扫描可连接 Wi-Fi。"
    group: "网络与 Wi-Fi"
    source: "src/api/wifi/index.ts"
    method: "GET"
    url: "{{controlNodeBaseUrl}}/scan_wifi"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/scan_wifi"
    headers: []
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        data:
          - key: "wifi-key"
            ssid: "wifi-name"
            signal: "-40"
            security: "WPA2"
            authRequired: true
            connected: false
            save: false
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": [\n    {\n      \"key\": \"wifi-key\",\n      \"ssid\": \"wifi-name\",\n      \"signal\": \"-40\",\n      \"security\": \"WPA2\",\n      \"authRequired\": true,\n      \"connected\": false,\n      \"save\": false\n    }\n  ],\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "连接 Wi-Fi"
    apiName: "connectWifiAPI"
    description: "按 ssid/password 连接 Wi-Fi。"
    group: "网络与 Wi-Fi"
    source: "src/api/wifi/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/connect_wifi"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/connect_wifi"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        ssid: "wifi-name"
        password: "wifi-password"
        save: true
      raw: "{\n  \"ssid\": \"wifi-name\",\n  \"password\": \"wifi-password\",\n  \"save\": true\n}"
    response:
      example:
        code: 0
        data: null
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": null,\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "断开 Wi-Fi"
    apiName: "disConnectWifiAPI"
    description: "断开指定 Wi-Fi。"
    group: "网络与 Wi-Fi"
    source: "src/api/wifi/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/disconnect_wifi"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/disconnect_wifi"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        ssid: "wifi-name"
      raw: "{\n  \"ssid\": \"wifi-name\"\n}"
    response:
      example:
        code: 0
        data: null
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": null,\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "获取热点列表"
    apiName: "getAPListAPI"
    description: "获取控制节点热点接口列表。"
    group: "网络与 Wi-Fi"
    source: "src/api/wifi/index.ts"
    method: "GET"
    url: "{{controlNodeBaseUrl}}/ap_list"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/ap_list"
    headers: []
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "none"
      example: null
    response:
      example:
        code: 0
        data:
          - iface: "wlan0"
            hotspot_active: true
            ssid: "tars-hotspot"
            password: "12345678"
            auto_start: true
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": [\n    {\n      \"iface\": \"wlan0\",\n      \"hotspot_active\": true,\n      \"ssid\": \"tars-hotspot\",\n      \"password\": \"12345678\",\n      \"auto_start\": true\n    }\n  ],\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "开启热点"
    apiName: "OpenHotspotAPI"
    description: "开启指定网卡热点。"
    group: "网络与 Wi-Fi"
    source: "src/api/wifi/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/open_hotspot"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/open_hotspot"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        iface: "wlan0"
        ssid: "tars-hotspot"
        password: "12345678"
        auto_start: true
      raw: "{\n  \"iface\": \"wlan0\",\n  \"ssid\": \"tars-hotspot\",\n  \"password\": \"12345678\",\n  \"auto_start\": true\n}"
    response:
      example:
        code: 0
        data:
          code: 0
          msg: "success"
          data: null
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"code\": 0,\n    \"msg\": \"success\",\n    \"data\": null\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "关闭热点"
    apiName: "closeHotspotAPI"
    description: "关闭指定网卡热点。"
    group: "网络与 Wi-Fi"
    source: "src/api/wifi/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/close_hotspot"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/close_hotspot"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        iface: "wlan0"
        auto_start: false
      raw: "{\n  \"iface\": \"wlan0\",\n  \"auto_start\": false\n}"
    response:
      example:
        code: 0
        data: null
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": null,\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
