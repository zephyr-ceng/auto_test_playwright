  - name: "下载导航模型文件"
    apiName: "downLoadFile"
    description: "按设计 ID 和文件名下载模型文件，返回 Blob。"
    group: "ROS 与导航"
    source: "src/api/ros/index.ts"
    method: "GET"
    url: "{{rosBaseUrl}}/download_model_file?id={{designId}}&filename={{filename}}"
    resolvedUrl: "http://192.168.0.52:38081/ros_api/v1/download_model_file?id={{designId}}&filename=model.stl"
    headers: []
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "none"
      example: null
