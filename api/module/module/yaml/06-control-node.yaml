apiSpecVersion: "1.0.0"
kind: "TarsModuleApiDocument"
source:
  descriptionFile: "api-docs/api-build.md"
  projectCollection: "api-docs/apifox-collection.postman.json"
  sharedEnvironment: "api-docs/apifox-shared-environment.postman_environment.json"
  generatedAt: "2026-06-24"
module:
  index: 6
  name: "控制节点"
  description: "本机文件、设备关机重启、版本、导出、录屏和升级。"
  markdown: "md/06-control-node.md"
  yaml: "yaml/06-control-node.yaml"
environment:
  frontendBaseUrl: "http://localhost:3000"
  baseUrl: "http://localhost:3000/tars/v1"
  gatewayUrl: "http://localhost:3000/tars/v1/gateway"
  controlNodeBaseUrl: "http://192.168.0.52:38080/tars/v1"
  rosBaseUrl: "http://192.168.0.52:38081/ros_api/v1"
  chatBaseUrl: "http://192.168.2.159:9999/api/v3"
conventions:
  encoding: "UTF-8"
  defaultContentType: "application/json"
  auth: "登录成功后通过 Set-Cookie 获取 session；后续接口由 Cookie Jar 或 Apifox Cookie 管理器携带登录态。"
  gateway: "网关接口固定请求 {{gatewayUrl}}，通过小写 command 请求头区分业务指令。"
  businessStatusCodes:
    - code: 0
      name: "Success"
      description: "请求成功且业务逻辑处理正常"
    - code: 40001
      name: "Unauthorized"
      description: "未登录或登录态 Cookie 已过期，客户端应重新登录"
    - code: 40003
      name: "Permission Denied"
      description: "权限不足，禁止访问该资源"
    - code: 50000
      name: "Internal Error"
      description: "服务器内部未知异常，请联系系统管理员"
endpoints:
  - name: "获取目录树"
    apiName: "getDirTree"
    description: "按路径和后缀过滤查询控制节点目录树。"
    group: "控制节点"
    source: "src/api/controlNode/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/get_dir_tree"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/get_dir_tree"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        path: "/data"
        fileFilter:
          - "stl"
          - "dcm"
      raw: "{\n  \"path\": \"/data\",\n  \"fileFilter\": [\n    \"stl\",\n    \"dcm\"\n  ]\n}"
    response:
      example:
        code: 0
        data:
          IsDir: true
          Name: "data"
          Path: "/data"
          Child: []
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": {\n    \"IsDir\": true,\n    \"Name\": \"data\",\n    \"Path\": \"/data\",\n    \"Child\": []\n  },\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "下载本地文件"
    apiName: "downloadLocalFile"
    description: "从控制节点下载本地文件，返回 Blob。"
    group: "控制节点"
    source: "src/api/controlNode/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/download_local_file"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/download_local_file"
    headers:
      - name: "Content-Type"
        value: "application/json"
        description: "JSON 请求体"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "raw"
      contentType: "application/json"
      example:
        filePath: "/data/model.stl"
      raw: "{\n  \"filePath\": \"/data/model.stl\"\n}"
    response:
      example: "<Blob>"
      raw: "<Blob>"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
  - name: "下载本地文件并上报进度"
    apiName: "downloadLocalFileWithProgress"
    description: "同下载本地文件，前端额外监听下载进度。"
