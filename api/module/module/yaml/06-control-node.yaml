  - name: "导出文件到移动盘"
    apiName: "exportFileToMobileDrive"
    description: "multipart/form-data 上传并写入指定路径。"
    group: "控制节点"
    source: "src/api/controlNode/index.ts"
    method: "POST"
    url: "{{controlNodeBaseUrl}}/put_caldata"
    resolvedUrl: "http://192.168.0.52:38080/tars/v1/put_caldata"
    headers:
      - name: "Content-Type"
        value: "multipart/form-data"
        description: "由 FormData 生成"
    gateway:
      enabled: false
    authRequired: true
    requestBody:
      mode: "formdata"
      contentType: "multipart/form-data"
      fields:
        - name: "fileName"
          type: "string"
          example: "model.stl"
          description: ""
        - name: "file"
          type: "file"
          example: "<File>"
          description: ""
        - name: "path"
          type: "string"
          example: "/usb"
          description: ""
    response:
      example:
        code: 0
        data: null
        message: "success"
      raw: "{\n  \"code\": 0,\n  \"data\": null,\n  \"message\": \"success\"\n}"
    variables:
      - "controlNodeBaseUrl"
    scripts:
      prerequest: false
      test: true
