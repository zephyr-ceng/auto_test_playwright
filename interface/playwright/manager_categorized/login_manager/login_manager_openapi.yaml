                    status: 2
                    featureKey: tarsLoginHelp
                    content: '<h1 style="text-align: start;">用户使用环境帮助说明</h1><p style="text-align:
                      start;">为确保本系统在使用过程中<strong>稳定、准确、流畅运行</strong>，请在使用前确认您的设备和浏览器环境符合以下要求。</p><hr/><p><br></p><h2
                      style="text-align: start;">一、推荐使用环境</h2><h3 style="text-align:
                      start;">1. 浏览器要求</h3><p style="text-align: start;">系统支持主流现代浏览器，但<strong>推荐优先使用
                      Google Chrome 浏览器以获得最佳体验</strong>。</p><blockquote style="text-align:
                      start;">若使用非 Chrome 浏览器时出现显示异常、交互异常或性能问题，建议切换至 Chrome 浏览器重新访问系统。</blockquote><hr/><p><br></p><h3
                      style="text-align: start;">2. 浏览器版本要求</h3><ul><li style="text-align:
                      start;">请使用各浏览器的<strong>最新稳定版本</strong></li><li style="text-align:
                      start;">过旧版本可能导致页面无法正常显示或操作失败</li></ul><hr/><p><br></p><h3 style="text-align:
                      start;">3. 设备要求</h3><p style="text-align: start;">建议使用：</p><ul><li
                      style="text-align: start;"><strong>台式电脑或笔记本电脑</strong></li><li
                      style="text-align: start;">操作系统：</li></ul><p style="text-align:
                      start;">不建议使用：</p><ul><li style="text-align: start;">手机</li><li
                      style="text-align: start;">平板</li><li style="text-align:...
