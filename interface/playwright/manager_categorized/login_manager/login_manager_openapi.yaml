                  - id: 20
                    name: 配准界面切面精度确认
                    status: 1
                    featureKey: precisionVerification
                    content: <h1><strong>导航配准页确认精度时的切面视图教程</strong></h1><h2><strong>1.
                      功能说明</strong></h2><p>在导航配准页进入确认精度阶段后，系统支持显示切面视图。</p><p>这个功能主要用于：</p><ul><li>在确认精度时同步查看当前牙位附近的切面情况</li><li>辅助判断标定针与牙面位置关系</li><li>让确认过程更直观</li></ul><h2><strong>2.
                      进入方式</strong></h2><ol><li>进入导航配准页。</li><li>按正常流程完成前面的配准步骤。</li><li>进入确认精度阶段后，继续按提示进行牙面确认。</li><li>当标定针接近目标牙面时，切面视图会自动显示。</li><li>这个视图不需要手动打开。</li></ol><p><img
                      src="https://tars-frontend-res-1303037276.cos.ap-chengdu.myqcloud.com/materials/20260512/508ffb1f-36ac-4c36-94f4-c210d793ab55.png"
                      alt="精度确认.png" data-href="" style=""/><br></p><h2><strong>3.
                      交互流程</strong></h2><p>实际使用时可以按下面理解：</p><ol><li>医生在配准页按照提示进入确认精度。</li><li>系统提示将标定针靠近黄色牙齿表面。</li><li>当位置接近可确认范围时，页面会自动弹出切面视图。</li><li>医生一边看主视图，一边结合切面视图确认当前位置关系。</li><li>确认完成后，继续后续流程即可。</li></ol><h2><strong>4.
                      显示效果说明</strong></h2><p>切面视图的特点是：</p><ul><li>自动出现，无需额外操作</li><li>主要用于确认精度阶段</li><li>用来辅助观察当前确认位置的局部切面关系</li><li>离开该确认场景后会自动消失</li></ul><p><br></p>
