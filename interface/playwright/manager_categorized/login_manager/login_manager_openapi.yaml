                      style="font-size: 16px;">设置弹窗包含以下功能模块：</span><span style="font-size:
                      16px;"><strong>网络设置、文件管理、MR配置、系统配置、OTP登录、离线设置、语言设置、关于</strong></span></p><p><br></p><h2><span
                      style="font-size: 19px;"><strong>网络设置</strong></span></h2><p><span
                      style="font-size: 16px;">用于设备网络连接管理。</span></p><p><img src="https://tars-frontend-res-1303037276.cos.ap-chengdu.myqcloud.com/materials/20260511/c2a1c1f2-6ede-4fa0-93c5-39157d865df9.png"
                      alt="设置-网络配置.png" data-href="" style=""/></p><h3><span style="font-size:
                      16px;"><strong>功能说明</strong></span></h3><ul><li><span style="font-size:
                      16px;">展示当前设备可搜索到的 Wi-Fi 列表</span></li><li><span style="font-size:
                      16px;">支持连接无线网络</span></li></ul><h3><span style="font-size:
                      16px;"><strong>操作步骤</strong></span></h3><ol><li><span style="font-size:
                      16px;">在列表中选择需要连接的Wi-Fi</span></li><li><span style="font-size:
                      16px;">点击【连接】按钮</span></li><li><span style="font-size: 16px;">输入对应密码</span></li><li><span
