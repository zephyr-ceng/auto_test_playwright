                  - id: 3
                    name: 病患管理页帮助说明
                    status: 2
                    featureKey: tarsPatientManagementHelp
                    content: '<p><span style="font-size: 24px;"><strong>病患管理页帮助说明</strong></span></p><h2><span
                      style="font-size: 19px;"><strong>病例管理</strong></span></h2><p><span
                      style="font-size: 16px;">在患者详情页面中，可对病例进行新增、编辑及删除操作。</span></p><h3><span
                      style="font-size: 16px;"><strong>新增病例</strong></span></h3><ul><li><span
                      style="font-size: 16px;">点击【新增病例】按钮</span></li><li><span style="font-size:
                      16px;">打开病例创建弹窗</span></li><li><span style="font-size: 16px;">填写相关信息后保存，即可完成创建</span></li></ul><p><img
                      src="https://tars-frontend-res-1303037276.cos.ap-chengdu.myqcloud.com/materials/20260514/44d6c83d-0610-485b-b271-5d9cb8e41ce9.png"
                      alt="患者详情-新建病历.png" data-href="" style=""/></p><h3><span style="font-size:
                      16px;"><strong>编辑病例</strong></span></h3><ul><li><span style="font-size:
                      16px;">在病例列表中找到目标病例</span></li><li><span style="font-size: 16px;">点击对应的【编辑】按钮</span></li><li><span
                      style="font-size: 16px;">在弹窗中修改信息并保存</span></li></ul><h3><span
